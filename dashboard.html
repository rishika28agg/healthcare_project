<!DOCTYPE html>
<html>
<head>
  <title>Doctor Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { padding: 8px; margin: 5px; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>

  <h2>🩺 Doctor Dashboard</h2>

  <label>Patient ID:</label>
  <input type="number" id="patientId" placeholder="Enter patient ID" />
  <br>

  <label>Doctor Token:</label><br>
  <textarea id="token" rows="3" cols="80"
    placeholder="Paste DOCTOR access token here"></textarea>
  <br>

  <button onclick="fetchVitals()">View Patient</button>

  <table id="vitalsTable" style="display:none;">
    <thead>
      <tr>
        <th>Heart Rate</th>
        <th>SpO₂</th>
        <th>Temperature</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

<script>
function fetchVitals() {
  const patientId = document.getElementById("patientId").value;
  const token = document.getElementById("token").value;

  fetch(`http://127.0.0.1:8000/api/vitals/doctor/${patientId}/`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  })
  .then(res => res.json())
  .then(data => {
    const table = document.getElementById("vitalsTable");
    const body = document.getElementById("tableBody");
    body.innerHTML = "";

    data.forEach(v => {
      body.innerHTML += `
        <tr>
          <td>${v.heart_rate}</td>
          <td>${v.spo2}</td>
          <td>${v.body_temperature}</td>
          <td>${v.timestamp}</td>
        </tr>
      `;
    });

    table.style.display = "table";
  })
  .catch(err => alert("Error fetching data"));
}
</script>

</body>
</html>
